<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NallaBot - AI Chatbot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+Tamil:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #7c6af7;
    --accent2: #f76ac8;
    --text: #e8e8f0;
    --muted: #6b6b85;
    --user-bubble: #1e1a3a;
    --ai-bubble: #131320;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans Tamil', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(124,106,247,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 80% 80%, rgba(247,106,200,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .header {
    position: relative;
    z-index: 10;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    color: white;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(124,106,247,0.4);
    animation: pulse-glow 3s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%,100% { box-shadow: 0 0 20px rgba(124,106,247,0.4); }
    50% { box-shadow: 0 0 35px rgba(124,106,247,0.7), 0 0 60px rgba(247,106,200,0.2); }
  }

  .header-info h1 {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }

  .status-dot {
    width: 7px; height: 7px;
    background: #4ade80;
    border-radius: 50%;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
    z-index: 1;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .message {
    display: flex;
    gap: 10px;
    animation: slide-up 0.3s ease forwards;
    max-width: 85%;
  }

  @keyframes slide-up {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    flex-direction: row-reverse;
    align-self: flex-end;
  }

  .message.ai { align-self: flex-start; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
  }

  .message.ai .avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
  }

  .message.user .avatar {
    background: var(--border);
    color: var(--muted);
  }

  .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.65;
    position: relative;
  }

  .message.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    color: var(--text);
  }

  .message.user .bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(124,106,247,0.3);
    border-top-right-radius: 4px;
    color: var(--text);
  }

  .timestamp {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    font-family: 'Space Mono', monospace;
  }

  .message.user .timestamp { text-align: right; }

  .typing-indicator {
    display: flex;
    gap: 10px;
    align-self: flex-start;
    animation: slide-up 0.3s ease forwards;
  }

  .typing-dots {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-radius: 14px;
    border-top-left-radius: 4px;
    padding: 14px 18px;
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .dot {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; background: color-mix(in srgb, var(--accent) 60%, var(--accent2)); }
  .dot:nth-child(3) { animation-delay: 0.4s; background: var(--accent2); }

  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
    text-align: center;
    padding: 32px;
  }

  .welcome-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 0 40px rgba(124,106,247,0.3);
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .welcome h2 { font-size: 20px; font-weight: 600; color: var(--text); }

  .welcome p {
    font-size: 13px;
    color: var(--muted);
    max-width: 280px;
    line-height: 1.6;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }

  .suggestion-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: 'Noto Sans Tamil', sans-serif;
  }

  .suggestion-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(124,106,247,0.08);
  }

  .input-area {
    position: relative;
    z-index: 10;
    padding: 16px;
    border-top: 1px solid var(--border);
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(20px);
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.2s;
  }

  .input-row:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,247,0.1);
  }

  #userInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Noto Sans Tamil', sans-serif;
    font-size: 14px;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    min-height: 22px;
  }

  #userInput::placeholder { color: var(--muted); }

  .send-btn {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 9px;
    color: white;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(124,106,247,0.5); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 16px; height: 16px; }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    font-family: 'Space Mono', monospace;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">AI</div>
  <div class="header-info">
    <h1>NallaBot ✦</h1>
    <div class="status">
      <div class="status-dot"></div>
      <span>Online · Ready to chat</span>
    </div>
  </div>
</div>

<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">🤖</div>
    <h2>வணக்கம்! நான் NallaBot</h2>
    <p>உங்களுக்கு எந்த விஷயத்திலும் உதவ தயாராக இருக்கிறேன். கீழே type பண்ணுங்க!</p>
    <div class="suggestions">
      <div class="suggestion-chip" onclick="sendSuggestion('நீ யார்?')">நீ யார்?</div>
      <div class="suggestion-chip" onclick="sendSuggestion('Tamil Nadu பத்தி சொல்லு')">Tamil Nadu பத்தி சொல்லு</div>
      <div class="suggestion-chip" onclick="sendSuggestion('ஒரு கவிதை எழுது')">கவிதை எழுது</div>
      <div class="suggestion-chip" onclick="sendSuggestion('Python code எழுத சொல்லு')">Python code help</div>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="userInput" placeholder="ஏதாவது கேளுங்க..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <div class="footer-note">Powered by Claude · Anthropic API</div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  let conversationHistory = [];
  let welcomeShown = true;

  // ⚠️ IMPORTANT: Replace with your actual Anthropic API key
  const API_KEY = 'YOUR_ANTHROPIC_API_KEY_HERE';

  function getTime() {
    return new Date().toLocaleTimeString('ta-IN', { hour: '2-digit', minute: '2-digit' });
  }

  function hideWelcome() {
    const welcome = document.getElementById('welcome');
    if (welcome && welcomeShown) {
      welcome.style.display = 'none';
      welcomeShown = false;
    }
  }

  function appendMessage(role, text) {
    hideWelcome();
    const div = document.createElement('div');
    div.className = `message ${role}`;
    const avatarLabel = role === 'ai' ? 'AI' : 'நீ';
    div.innerHTML = `
      <div class="avatar">${avatarLabel}</div>
      <div>
        <div class="bubble">${text.replace(/\n/g, '<br>')}</div>
        <div class="timestamp">${getTime()}</div>
      </div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    hideWelcome();
    const div = document.createElement('div');
    div.className = 'typing-indicator';
    div.id = 'typing';
    div.innerHTML = `
      <div class="avatar" style="background: linear-gradient(135deg, #7c6af7, #f76ac8); color:white;">AI</div>
      <div class="typing-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    appendMessage('user', text);
    conversationHistory.push({ role: 'user', content: text });

    showTyping();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': API_KEY,
          'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: `நீ NallaBot என்ற AI assistant. நீ தமிழிலும் ஆங்கிலத்திலும் பதில் சொல்லலாம். User தமிழில் கேட்டால் தமிழில் பதில் சொல். User ஆங்கிலத்தில் கேட்டால் ஆங்கிலத்தில் பதில் சொல். நீ helpful, friendly, மற்றும் informative ஆக இரு.`,
          messages: conversationHistory
        })
      });

      const data = await response.json();
      removeTyping();

      const reply = data.content?.map(b => b.text || '').join('') || 'மன்னிக்கவும், பதில் கிடைக்கவில்லை.';
      conversationHistory.push({ role: 'assistant', content: reply });
      appendMessage('ai', reply);

    } catch (err) {
      removeTyping();
      appendMessage('ai', '⚠️ Connection error. மீண்டும் try பண்ணுங்க.');
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  function sendSuggestion(text) {
    inputEl.value = text;
    sendMessage();
  }

  // Auto-resize textarea
  inputEl.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  // Enter to send, Shift+Enter for newline
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
